name: Android CI & Release

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html style.css script.js www/
          cp logo.png www/logo.png

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: premium-notes-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release-unsigned.apk
          tag_name: v2.1.${{ github.run_number }}
          name: Premium Notes v2.1.${{ github.run_number }}
          body: |
            Premium Notes UI/UX refresh.

            - Modern responsive mobile layout
            - Better note cards and editor
            - Improved search and writing statistics
            - Safer note rendering
            - More reliable autosave
            - Fixed Android web-asset packaging
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
