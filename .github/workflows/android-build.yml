name: Android CI & Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install dependencies
      run: npm install

    - name: Make webDir for Capacitor
      run: |
        mkdir -p www
        cp index.html style.css script.js www/

    - name: Update Capacitor config for webDir
      run: sed -i 's/"webDir": "."/"webDir": "www"/' capacitor.config.json

    - name: Add Android platform (if not already added)
      run: npx cap add android || true

    - name: Sync Capacitor project
      run: npx cap sync android

    - name: Build Android release APK
      run: cd android && ./gradlew assembleRelease

    - name: Rename APK for release
      run: mv android/app/build/outputs/apk/release/app-release.apk PremiumNotes-v1.0.apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: PremiumNotes-v1.0.apk

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        files: PremiumNotes-v1.0.apk
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        body: |
          Automated release for Premium Notes.
          
          ### Changes
          - Initial Android build
          - Premium Dark UI
          - Local Storage & Backup features
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
