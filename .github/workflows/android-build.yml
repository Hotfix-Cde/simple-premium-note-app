name: Android CI & Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install dependencies
      run: npm install

    - name: Prepare web assets
      run: |
        mkdir -p www
        cp index.html style.css script.js www/
        # Ensure logo exists if it's referenced later
        touch www/logo.png 

    - name: Initialize Capacitor Android
      run: |
        npx cap add android || true
        npx cap sync android

    - name: Build Android release APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Rename APK for release
      run: cp android/app/build/outputs/apk/release/app-release-unsigned.apk PremiumNotes-v1.0.apk || cp android/app/build/outputs/apk/release/app-release.apk PremiumNotes-v1.0.apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: PremiumNotes-v1.0.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: PremiumNotes-v1.0.apk
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        body: |
          Automated release for Premium Notes.
          
          ### Features
          - Premium Dark UI
          - Offline-first Local Storage
          - Backup & Restore (.json)
          - Android APK included
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
