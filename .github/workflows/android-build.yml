name: Android CI & Release

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html style.css script.js www/
          cp logo.svg www/logo.svg
          if [ -f logo.png ]; then cp logo.png www/logo.png; fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Create temporary release keystore
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p "$RUNNER_TEMP/android-signing"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/android-signing/release.jks" \
            -storetype PKCS12 \
            -alias novavault-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass novavault-build \
            -keypass novavault-build \
            -dname "CN=NovaVault, OU=Android, O=NovaVault, L=Kathmandu, ST=Bagmati, C=NP"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/android-signing/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=novavault-build" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=novavault-build" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=novavault-release" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          cp "$APK" "$GITHUB_WORKSPACE/NovaVault-${{ github.run_number }}.apk"

      - name: Verify APK signature
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          jarsigner -verify -verbose -certs "${{ steps.apk.outputs.path }}"
          echo "APK signature verification passed."

      - name: Upload APK artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: novavault-apk
          path: NovaVault-${{ github.run_number }}.apk

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: NovaVault-${{ github.run_number }}.apk
          tag_name: v3.0.${{ github.run_number }}
          name: NovaVault v3.0.${{ github.run_number }}
          body: |
            NovaVault premium Android release.

            - Premium interactive dashboard
            - Search, sorting, tags, categories, filters
            - Templates, markdown preview, color labels
            - Pin, favorite, archive, duplicate and autosave
            - Import/export backups for offline use
            - Signed Android APK attached automatically

            Note: this CI build uses a temporary signing key so the repository needs no private signing secrets. A persistent Play Store signing key can be configured later for upgrade continuity.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
