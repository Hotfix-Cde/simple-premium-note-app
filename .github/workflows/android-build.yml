name: Android CI & Release

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html style.css script.js www/
          cp logo.svg www/logo.svg
          cp logo.png www/logo.png

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode release keystore
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/release.jks
          chmod 600 ~/.android/release.jks
          keytool -list -keystore ~/.android/release.jks -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1 \
            || { echo "Keystore invalid or credentials wrong"; exit 1; }
          echo "KEYSTORE_FILE=$HOME/.android/release.jks" >> "$GITHUB_ENV"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Build signed release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: ${{ github.event_name == 'pull_request' && '' || env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Verify signed APK signature
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          jarsigner -verify -verbose -certs "$APK"
          echo "Signature verification passed."

      - name: Upload signed APK artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: premium-notes-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Publish signed APK to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release-unsigned.apk
          tag_name: v3.0.${{ github.run_number }}
          name: NovaVault v3.0.${{ github.run_number }}
          body: |
            NovaVault premium release build.

            - Glassy dashboard with live stats
            - Search, sort, tags, categories, and filters
            - Templates, markdown preview, and color labels
            - Pin, favorite, archive, duplicate, and autosave
            - Import/export backups for offline use
            - Android APK built and attached automatically
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}